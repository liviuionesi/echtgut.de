
plugins {
    id 'java'
    id 'org.springframework.boot' version "${springBootVersion}"
    id 'io.spring.dependency-management' version "${springDependencyManagementVersion}"
    id 'jacoco'
    // SonarQube static analysis. Run: ./gradlew test jacocoTestReport sonar
    id 'org.sonarqube' version "${sonarqubePluginVersion}"
    // Formatting gate — spotlessCheck runs as part of `check`.
    id 'com.diffplug.spotless' version "${spotlessVersion}"
    // Dependency/security-scan gate. Run: ./gradlew dependencyCheckAggregate
    id 'org.owasp.dependencycheck' version "${owaspDependencyCheckVersion}"
}

group = 'de.echtgut'
version = projectVersion

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(Integer.parseInt(javaVersion))
    }
}

configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-security'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-actuator'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-flyway'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-database-postgresql'
    implementation "io.jsonwebtoken:jjwt-api:${jjwtVersion}"

    runtimeOnly 'org.postgresql:postgresql'
    runtimeOnly "io.jsonwebtoken:jjwt-impl:${jjwtVersion}"
    runtimeOnly "io.jsonwebtoken:jjwt-jackson:${jjwtVersion}"

    compileOnly "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor "org.projectlombok:lombok:${lombokVersion}"
    annotationProcessor 'org.springframework.boot:spring-boot-configuration-processor'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
    testImplementation 'org.springframework.security:spring-security-test'
    testImplementation 'com.h2database:h2'
    testImplementation "org.testcontainers:postgresql:${testcontainersVersion}"
    testImplementation "org.testcontainers:junit-jupiter:${testcontainersVersion}"
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

// ---------------------------------------------------------------------------
// SonarQube / SonarCloud
// ---------------------------------------------------------------------------
// Host/token come from the environment — credentials never live in the repo.
// Local self-hosted:  SONAR_HOST_URL defaults to http://localhost:9000
// CI (SonarCloud):    set SONAR_TOKEN + SONAR_ORGANIZATION secrets
// Run:  ./gradlew test jacocoTestReport sonar
sonar {
    properties {
        property 'sonar.projectKey', 'echtgut'
        property 'sonar.projectName', 'echtgut.de'
        property 'sonar.host.url', System.getenv('SONAR_HOST_URL') ?: 'http://localhost:9000'
        if (System.getenv('SONAR_TOKEN')) {
            property 'sonar.token', System.getenv('SONAR_TOKEN')
        }
        // SonarCloud requires an organization key; self-hosted ignores it.
        if (System.getenv('SONAR_ORGANIZATION')) {
            property 'sonar.organization', System.getenv('SONAR_ORGANIZATION')
        }

        // JaCoCo XML report produced by jacocoTestReport task.
        property 'sonar.coverage.jacoco.xmlReportPaths',
                "${rootDir}/build/reports/jacoco/test/jacocoTestReport.xml"

        // Never analyze generated or build output.
        property 'sonar.exclusions',
                '**/generated/**,**/build/**,**/bin/**'

        // Coverage exclusions — analyzed for bugs/smells but not counted
        // against coverage: bootstrap class, @Configuration wiring, DTOs.
        property 'sonar.coverage.exclusions',
                '**/*Application.java,**/config/**,**/dto/**,**/*Config.java'

        // Test-file rule relaxations:
        //   S100  method naming — test methods use descriptive underscores
        //   S3305 field injection — @Autowired on fields is standard in Spring tests
        //   S1192 string-literal duplication — readability beats DRY in tests
        property 'sonar.issue.ignore.multicriteria', 'e1,e2,e3'
        property 'sonar.issue.ignore.multicriteria.e1.ruleKey', 'java:S100'
        property 'sonar.issue.ignore.multicriteria.e1.resourceKey', '**/src/test/**/*'
        property 'sonar.issue.ignore.multicriteria.e2.ruleKey', 'java:S3305'
        property 'sonar.issue.ignore.multicriteria.e2.resourceKey', '**/src/test/**/*'
        property 'sonar.issue.ignore.multicriteria.e3.ruleKey', 'java:S1192'
        property 'sonar.issue.ignore.multicriteria.e3.resourceKey', '**/src/test/**/*'
    }
}

// ---------------------------------------------------------------------------
// Spotless — formatting gate
// ---------------------------------------------------------------------------
spotless {
    java {
        target 'src/**/*.java'
        googleJavaFormat()
        removeUnusedImports()
        trimTrailingWhitespace()
        endWithNewline()
    }
}

// ---------------------------------------------------------------------------
// Tests
// ---------------------------------------------------------------------------
tasks.withType(Test) {
    useJUnitPlatform()

    reports {
        junitXml.required = true
        html.required = true
    }

    testLogging {
        events = ['failed', 'skipped']
        exceptionFormat = 'full'
        showStandardStreams = false
        showCauses = true
        showStackTraces = true

        info {
            events = ['started', 'passed', 'skipped', 'failed']
            exceptionFormat = 'full'
        }
    }

    afterSuite { desc, result ->
        if (!desc.parent) {
            def output = "Results: ${result.resultType} (${result.testCount} tests, ${result.successfulTestCount} passed, ${result.failedTestCount} failed, ${result.skippedTestCount} skipped)"
            def startItem = '|  ', endItem = '  |'
            def repeatLength = startItem.length() + output.length() + endItem.length()
            println('\n' + ('=' * repeatLength))
            println(startItem + output + endItem)
            println('=' * repeatLength)
        }
    }
}

// ---------------------------------------------------------------------------
// JaCoCo
// ---------------------------------------------------------------------------
// Classes excluded from coverage: bootstrap entry point, @Configuration
// wiring, and DTOs have no branch logic worth a unit test.
def jacocoCoverageExclusions = [
        '**/EchtgutBackendApplication.class',
        '**/config/**',
        '**/dto/**',
        '**/*Config.class',
]

jacocoTestReport {
    dependsOn test
    reports {
        xml.required = true
        html.required = true
    }
    afterEvaluate {
        classDirectories.setFrom(files(classDirectories.files.collect {
            fileTree(dir: it, exclude: jacocoCoverageExclusions)
        }))
    }
}

jacocoTestCoverageVerification {
    dependsOn test
    classDirectories.setFrom(files {
        sourceSets.main.output.classesDirs.collect { dir ->
            fileTree(dir: dir, excludes: jacocoCoverageExclusions)
        }
    })
    violationRules {
        rule {
            limit {
                counter = 'LINE'
                value = 'COVEREDRATIO'
                minimum = 0.80
            }
        }
    }
}

test {
    finalizedBy jacocoTestReport
}

check.dependsOn jacocoTestCoverageVerification

// ---------------------------------------------------------------------------
// OWASP Dependency-Check
// ---------------------------------------------------------------------------
// Scans resolved dependencies for known CVEs (NVD database).
// Optional NVD_API_KEY env var raises the NVD download rate limit.
// Run: ./gradlew dependencyCheckAggregate  (or dependencyCheck for single-module)
dependencyCheck {
    failBuildOnCVSS = 0
    failOnError = false
    // HTML only — that's the one CI actually uploads as an artifact.
    formats = ['HTML']
    // Fixed, predictable path so CI can cache the NVD database across runs.
    data {
        directory = "${rootDir}/.dependency-check-data"
    }
    nvd {
        if (System.getenv('NVD_API_KEY')) {
            apiKey = System.getenv('NVD_API_KEY')
        }
    }
    suppressionFile = "${rootDir}/dependency-check-suppressions.xml"
    analyzers {
        assemblyEnabled = false
        nodeAuditEnabled = false
        nodeEnabled = false
    }
}
