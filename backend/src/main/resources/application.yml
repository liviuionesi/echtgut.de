spring:
  application:
    name: echtgut-backend
  datasource:
    url: ${POSTGRES_URL:jdbc:postgresql://localhost:5432/echtgut}
    username: ${POSTGRES_USERNAME:admin}
    password: ${POSTGRES_PASSWORD:admin}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: "health,info"
  endpoint:
    health:
      show-details: always

# External APIs
google:
  places:
    api-key: ${GOOGLE_PLACES_API_KEY:}
