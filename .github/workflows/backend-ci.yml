name: Backend CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-ci.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'backend/**'

jobs:
  build:
    name: Build & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    # secrets.* can't be referenced directly in a step `if:` (GitHub Actions
    # rejects it — "Unrecognized named-value: 'secrets'"). Job-level `env:`
    # *can* read secrets, so resolve the presence check here once and have
    # the SonarQube step's `if:` read the env var instead.
    env:
      HAS_SONAR_TOKEN: ${{ secrets.SONAR_TOKEN != '' }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'
      
      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Build backend
        # Also runs `check`, which includes spotlessCheck — formatting
        # violations fail the build here, no separate step needed.
        run: ./gradlew clean build -x test
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"
      
      - name: Run tests
        run: ./gradlew test
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"
      
      - name: Generate test coverage report
        run: ./gradlew jacocoTestReport
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

      - name: Verify coverage threshold
        # Minimum line coverage per build.gradle's shared
        # jacocoTestCoverageVerification config (see DEFINITION_OF_DONE.md).
        run: ./gradlew jacocoTestCoverageVerification
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"

      - name: SonarQube analysis
        # Runs only once a SONAR_TOKEN secret is configured. SonarCloud's
        # free tier requires a PUBLIC repo — this repo starts private
        # (REQUIREMENTS.md NFR-1), so this step has nothing to authenticate
        # against yet. Once the repo goes public (or a paid Sonar plan is
        # added), set SONAR_TOKEN/SONAR_ORGANIZATION and this activates with
        # no other change. Until then it's skipped rather than failing the
        # build on a missing credential, mirroring the NVD_API_KEY
        # non-blocking pattern below: an unconfigured *optional* external
        # integration shouldn't block CI.
        #
        # Also restricted to pushes on `main`: SonarCloud's free/Community
        # org plan only stores analysis for the default branch — a
        # `develop` push reports BUILD SUCCESSFUL locally, but SonarCloud
        # silently discards it server-side. `main` only moves at
        # Sprint-end merges, so this still analyzes every real Increment.
        if: ${{ env.HAS_SONAR_TOKEN == 'true' && github.ref == 'refs/heads/main' }}
        run: ./gradlew sonar
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: https://sonarcloud.io
          SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION }}

      - name: Compute cache week
        id: dc-week
        # %G/%V (ISO week-based year/week), not %Y/%V — late-December ISO
        # week 1 can belong to the next Gregorian year, which would
        # otherwise mislabel the cache key right at the year boundary.
        run: echo "week=$(date -u +%G-W%V)" >> "$GITHUB_OUTPUT"

      - name: Restore OWASP Dependency-Check NVD database cache
        id: dc-cache
        uses: actions/cache/restore@v4
        with:
          path: backend/.dependency-check-data
          key: dependency-check-nvd-v2-${{ steps.dc-week.outputs.week }}
          restore-keys: dependency-check-nvd-v2-

      - name: Dependency/security scan
        continue-on-error: true
        # Inherited hard-won handling from lmdb.dev's own CI history: with
        # no NVD_API_KEY secret configured, a cache-miss NVD sync routinely
        # exceeds 20 minutes, and since the step never finishes, its cache
        # never saves either — a permanent failure loop on every run.
        #
        # A *timeout with no key configured* is treated as non-blocking —
        # a known limitation, not a real finding — but the forced kill can
        # leave a partially-written NVD cache behind, so that branch always
        # wipes .dependency-check-data before exiting rather than let a
        # corrupt directory reach the save step.
        #
        # A crash matching dependency-check's own DB-corruption signature
        # (distinct from a real CVE finding, which fails via
        # build.gradle's failBuildOnCVSS through a normal Gradle
        # BUILD FAILED, not these low-level H2/NIO exceptions) is treated
        # as a corrupted-cache problem: wipe and retry once. A second
        # failure of any kind still fails the step for real — this can't
        # mask a genuine security failure, only recover from a bad cache.
        timeout-minutes: 45
        run: |
          set +e
          attempt=1
          max_attempts=2
          while [ "$attempt" -le "$max_attempts" ]; do
            timeout --kill-after=10s 1200 ./gradlew dependencyCheckAggregate 2>&1 | tee dependency-check.log
            status=${PIPESTATUS[0]}

            if [ "$status" -eq 124 ] && [ -z "$NVD_API_KEY" ]; then
              echo "::warning::dependency-check timed out after 20m with no NVD_API_KEY configured (#109) — known limitation, treated as non-blocking. A real CVE finding, or a timeout once the key is set, still fails this step."
              rm -rf .dependency-check-data
              status=0
              break
            fi

            if [ "$status" -ne 0 ] && [ "$attempt" -lt "$max_attempts" ] && grep -qE "MVStoreException|ClosedChannelException" dependency-check.log; then
              echo "::warning::dependency-check crashed reading a corrupted local NVD cache (#109) — wiping the cache and retrying once."
              rm -rf .dependency-check-data
              attempt=$((attempt + 1))
              continue
            fi

            break
          done
          set -e
          exit "$status"
        env:
          GRADLE_OPTS: "-Dorg.gradle.daemon=false"
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

      - name: Save OWASP Dependency-Check NVD database cache
        # Only cache a scan that actually completed cleanly — never a
        # killed/wiped or corrupted run. If the scan above wiped
        # .dependency-check-data, this step just finds nothing to save.
        if: success()
        uses: actions/cache/save@v4
        with:
          path: backend/.dependency-check-data
          key: ${{ steps.dc-cache.outputs.cache-primary-key }}

      - name: Upload dependency-check report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-check-report
          path: backend/build/reports/dependency-check-report.html

      - name: Upload dependency-check raw log
        # Only exists on failure paths above — helps diagnose a future
        # corruption-retry or a real CVE failure without re-running CI.
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: dependency-check-log
          path: backend/dependency-check.log
          if-no-files-found: ignore

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results
          path: |
            backend/build/test-results/test/**/*.xml
            backend/build/reports/tests/test/

      - name: Upload coverage reports
        uses: actions/upload-artifact@v7
        with:
          name: coverage-reports
          path: backend/build/reports/jacoco/test/

