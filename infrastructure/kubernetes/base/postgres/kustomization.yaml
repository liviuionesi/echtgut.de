apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - statefulset.yaml
  - service.yaml

configMapGenerator:
  # A single database, unlike lmdb.dev's database-per-service split — echtgut
  # is one Spring Boot app, so there's nothing to shard the schema across.
  - name: postgres-config
    literals:
      - POSTGRES_DB=echtgut

generatorOptions:
  disableNameSuffixHash: false
